[project]
name = "terragrok"
version = "0.1.0"
description = "Terraforming & procedural world geography/topography research and testbed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastscapelib>=0.3.0",
    "landlab>=2.11.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "pyfastnoiselite>=0.0.7",
    "scipy>=1.14.0",
    "whitebox-workflows>=2.0.0",
]

[project.optional-dependencies]
diffusion = [
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "diffusers>=0.30.3",
    "accelerate>=0.34.2",
    "safetensors>=0.4.5",
    "infinite-tensor>=0.3.0",
    "h5py>=3.12.1",
    "scikit-image>=0.24.0",
    "numba>=0.59.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.5",
    "rasterio>=1.4.0",
    "ema-pytorch>=0.7.7",
    "click>=8.1.6",
]
